name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: test-secret-not-used-anywhere-real
        run: python -m pytest -q

      - name: Check every module imports
        working-directory: backend
        env:
          JWT_SECRET: test-secret-not-used-anywhere-real
        run: python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: forntend/package-lock.json

      - name: Install dependencies
        working-directory: forntend
        run: npm ci

      - name: Build
        working-directory: forntend
        env:
          CI: true          # warnings fail the build, which is the point
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The handoff notes say .env currently holds a real key and password.
      # This job is here so it can never happen again silently.
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
